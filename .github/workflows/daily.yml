name: daily-edition

# Writes and publishes the briefing every morning, and on demand from the Actions tab.
on:
  schedule:
    # 02:07 UTC = 07:07 in Pakistan (UTC+5). GitHub can start scheduled runs a few minutes late;
    # avoiding minute 0 helps, because that is when GitHub is busiest.
    - cron: "7 2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow commit the new edition back to the repo

concurrency:
  group: daily-edition
  cancel-in-progress: false   # never interrupt a run that is halfway through

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Check the API key is set
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is not set. Add it under Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - name: Write today's briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # optional fallback; fine if not set
        run: python -m newsroom brief -v

      - name: Publish the edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions/
          if git diff --cached --quiet; then
            echo "No new edition to publish."
            exit 0
          fi
          git commit -m "edition: $(date -u +%Y-%m-%d)"
          # If someone pushed while the newsroom was working, put today's edition on top and try again.
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            echo "Push failed (attempt $attempt), retrying in 10s…"
            sleep 10
          done
          exit 1

      - name: Keep the run log for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_number }}
          path: data/
          retention-days: 14
          if-no-files-found: ignore
